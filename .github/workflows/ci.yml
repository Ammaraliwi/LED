name: CI

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ledwave_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ledwave_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Build-time placeholders only. CI never receives a deployable database or auth secret.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ledwave_ci
      AUTH_SECRET: ci-only-placeholder-not-used-in-production
      APP_URL: http://localhost:3000
      MFA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RUN_INTEGRATION_TESTS: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Check migrations
        run: npm run db:check

      - name: Apply migrations to ephemeral PostgreSQL
        run: npm run db:migrate

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
